<!doctype html>
<!--
  Level 6 (map id "level3"): first a swap tutorial, QRECEC_3QubitRepetition.ipynb's 11 steps with the 3-qubit
  repetition code (one Space press per step, with lesson notes between them), then Mario and Peach send messages across
  the Alice–Bob–Charlie repeater chain while cloud turtles try to eavesdrop. The simulation runs in the Python backend:
  run `npm run backend` and open http://localhost:8001/qkd.html (or http://localhost:8001 for the title screen).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Level 6: QKD to Peach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="styles/world.css">
    <link rel="stylesheet" href="styles/towers.css">
    <link rel="stylesheet" href="styles/qkd.css">
    <link rel="stylesheet" href="styles/qubit_tower.css">
    <link rel="stylesheet" href="styles/swap_tutorial.css">
    <script type="module" src="src/qkd/qkd_main.js"></script>
</head>
<body class="level-page qkd-page">
    <header class="hud">
        <div class="hud-item"><span class="hud-label">KEY</span><span id="hud-key">000</span></div>
        <div class="hud-item"><span class="hud-label">WORLD</span><span>1-6</span></div>
        <div class="hud-item"><span class="hud-label">STEP</span><span id="hud-step">--</span></div>
        <div class="hud-item"><span class="hud-label">QBER</span><span id="hud-qber">--</span></div>
        <a class="hud-link" href="start.html#map-level3">◀ Map</a>
    </header>

    <main class="world">
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>
        <div class="hill hill-left"></div>
        <div class="hill hill-right"></div>
        <div class="sky-panel">
            <div class="sky-slot">
                <p id="status-banner" class="sky-status" aria-live="polite">Watch Bob link two towers, then send Peach a secret!</p>
                <section id="step-card" class="step-card" aria-live="polite" aria-labelledby="step-card-title">
                    <header class="step-card-heading">
                        <p id="step-card-counter" class="step-card-counter"></p>
                        <h2 id="step-card-title" class="step-card-title"></h2>
                    </header>
                    <div id="step-card-body" class="step-card-body"></div>
                </section>
            </div>
            <p id="key-hints" class="key-hints" aria-live="polite"></p>
        </div>
        <div class="track-scroller">
            <div id="track" class="track qkd-track"></div>
        </div>
        <div class="ground"></div>
    </main>

    <section class="controls qkd-controls">
        <div class="plumber-panel is-mario">
            <label class="control-field">
                Mario says
                <input id="mario-input" class="message-input" type="text" value="Its-a me!" autocomplete="off">
            </label>
            <div class="action-row">
                <button class="pixel-button action-button" data-sender="mario"
                        data-kind="classical">Q Classical</button>
                <button class="pixel-button action-button" data-sender="mario"
                        data-kind="encrypted">W Encrypted</button>
                <button class="pixel-button action-button" data-sender="mario" data-kind="quantum">E Quantum</button>
            </div>
        </div>

        <div class="settings-panel">
            <label class="toggle-field">
                <input id="turtle-toggle" type="checkbox">
                Cloud turtles eavesdrop
            </label>
            <label class="control-field">
                Turtles tap <span id="tap-label">100%</span>
                <input id="tap-slider" type="range">
            </label>
            <label class="control-field">
                Physical error p <span id="error-label">0.10%</span>
                <input id="error-slider" type="range">
            </label>
            <label class="control-field">
                Seed
                <input id="seed-input" type="number" inputmode="numeric">
            </label>
        </div>

        <div class="plumber-panel is-peach">
            <label class="control-field">
                Peach says
                <input id="luigi-input" class="message-input" type="text" value="Thank you!" autocomplete="off">
            </label>
            <div class="action-row">
                <button class="pixel-button action-button" data-sender="luigi"
                        data-kind="classical">I Classical</button>
                <button class="pixel-button action-button" data-sender="luigi"
                        data-kind="encrypted">O Encrypted</button>
                <button class="pixel-button action-button" data-sender="luigi" data-kind="quantum">P Quantum</button>
            </div>
        </div>
    </section>

</body>
</html>
