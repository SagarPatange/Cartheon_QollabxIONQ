<!doctype html>
<!--
  Toad's BB84 hut: not a level, a side stop off Level 2 on the world map where Mario learns how BB84 shares a secret
  key (Bennett & Brassard 1984) before Level 4. Front end only. Open it from the world map (start.html#map).
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toad's BB84 hut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="styles/world.css">
    <link rel="stylesheet" href="styles/hut.css">
    <link rel="stylesheet" href="styles/bb84_hut.css">
    <script type="module" src="src/bb84_hut/bb84_hut_main.js"></script>
</head>
<body class="hut-page bb84-page">
    <header class="hud">
        <div class="hud-item"><span class="hud-label">TOAD'S HUT</span><span>BB84</span></div>
        <a class="hud-link" href="start.html#map-bb84-hut">◀ Map</a>
    </header>

    <main class="hut-room bb84-room">
        <div class="bb84-toad-column">
            <div id="toad" class="toad" role="img" aria-label="Toad"></div>
            <p class="bb84-toad-name">Toad</p>
        </div>
        <section class="toad-speech bb84-speech" aria-labelledby="page-title">
            <h1 id="page-title" class="bb84-page-title">Toad's BB84 hut</h1>
            <div class="bb84-panel" aria-live="polite">
                <h2 id="panel-heading" class="bb84-panel-heading">Two bases</h2>
                <div id="panel-lines" class="bb84-panel-lines"></div>
            </div>
            <div id="panel-picture" class="bb84-picture"></div>
            <div class="bb84-controls">
                <nav class="bb84-paging" aria-label="Panels">
                    <button id="previous-button" class="pixel-button is-secondary" type="button">◀ Back</button>
                    <span id="panel-counter" class="bb84-counter">1 / 6</span>
                    <button id="next-button" class="pixel-button" type="button">Next ▶</button>
                </nav>
                <p class="bb84-keys">Space, Enter or Right arrow: next panel. Left arrow: back.</p>
            </div>
        </section>
    </main>

    <footer class="bb84-footer">
        <p class="bb84-sources">
            <span id="panel-source"></span>
            <a id="award-source-link" target="_blank" rel="noopener"></a>
            <a id="wikipedia-link" target="_blank" rel="noopener">BB84 on Wikipedia (new tab)</a>
            <span class="bb84-attribution">This effort is supported by Qollab &amp; IonQ.</span>
        </p>
    </footer>
</body>
</html>
