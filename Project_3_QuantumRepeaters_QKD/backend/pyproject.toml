[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-bros"
version = "0.1.0"
description = "Stim-backed QRE-CEC and QKD simulator behind the Quantum Bros game"
requires-python = ">=3.11"
# Pinned: stim's random streams are part of what a seed reproduces.
dependencies = [
    "stim==1.16.0",
    # Pinned to what Qollab (browser Pyodide) provides; QiskitStabilizerBackend runs where Stim cannot.
    "qiskit==2.5.2",
    "fastapi==0.142.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_bros"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
